<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng...</title>
</head>

<body>
  <p id="message">Đang chuyển hướng...</p>

  <script>
    const linkA = "https://monkeydd.com/phuong-vi-nhym.html";
    const linkB = "https://s.shopee.vn/8KobywvTCF";

    const key = "phuong_vi_clicked";

    const daBam = localStorage.getItem(key);

    if (!daBam) {
      // LẦN ĐẦU → LINK A
      localStorage.setItem(key, "yes");
      document.getElementById("message").innerText =
        "Đang chuyển đến trang truyện...";
      window.location.replace(linkA);

    } else {
      // LẦN 2, 3, 4... → LINK B
      document.getElementById("message").innerText =
        "Đang chuyển đến liên kết Shopee...";
      window.location.replace(linkB);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PHƯỢNG VỊ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f7f7f7;

      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .box {
      width: calc(100% - 40px);
      max-width: 420px;

      padding: 38px 24px;

      background: #ffffff;

      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 12px;

      font-family: Georgia, serif;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .completed {
      margin: 0;

      font-size: 14px;
      font-weight: 600;

      color: #777;
    }

    .destination {
      margin-top: 22px;

      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>PHƯỢNG VỊ</h1>

    <p class="completed">
      TRUYỆN ĐÃ HOÀN THÀNH
    </p>

    <p
      class="destination"
      id="destination">
    </p>

  </div>


  <script>

    /* LINK SHOPEE */
    const shopeeLink =
      "https://s.shopee.vn/2LXOs0571K";


    /* LINK TRUYỆN */
    const storyLink =
      "https://monkeydd.com/phuong-vi-nhym.html";


    /*
      Bộ đếm riêng trên trình duyệt.

      Đổi tên key nếu muốn reset
      và bắt đầu lại từ lượt số 1.
    */

    const key =
      "phuong_vi_cycle_v6";


    let count =
      parseInt(
        localStorage.getItem(key) || "0"
      );


    count++;


    localStorage.setItem(
      key,
      count.toString()
    );


    /*
      CHU KỲ:

      1  = Shopee

      2  = MonkeyD
      3  = MonkeyD
      4  = MonkeyD

      5  = Shopee

      6  = MonkeyD
      7  = MonkeyD
      8  = MonkeyD

      9  = Shopee

      ... cứ lặp lại
    */

    const goShopee =
      ((count - 1) % 4 === 0);


    let target;


    if (goShopee) {

      target = shopeeLink;

      document
        .getElementById("destination")
        .textContent =
        "Đang mở liên kết Shopee...";

    } else {

      target = storyLink;

      document
        .getElementById("destination")
        .textContent =
        "Đang mở trang truyện...";

    }


    /*
      Chờ một chút để giao diện
      kịp hiện rồi mới chuyển trang.
    */

    setTimeout(function () {

      window.location.replace(target);

    }, 700);

  </script>

</body>
</html>

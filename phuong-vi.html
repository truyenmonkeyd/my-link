<body>

<script>
  const shopeeLink =
    "https://s.shopee.vn/2LXOs0571K";

  const monkeyDLink =
    "https://monkeydd.com/phuong-vi-nhym.html";

  /*
    Chu kỳ:
    1 = Shopee
    2 = MonkeyD
    3 = MonkeyD
    4 = MonkeyD

    5 = Shopee
    6 = MonkeyD
    7 = MonkeyD
    8 = MonkeyD

    rồi lặp lại...
  */

  const key = "phuong_vi_cycle_v10";

  let count =
    parseInt(localStorage.getItem(key) || "0", 10);

  count++;

  localStorage.setItem(key, String(count));

  const goShopee =
    ((count - 1) % 4 === 0);

  if (goShopee) {
    window.location.replace(shopeeLink);
  } else {
    window.location.replace(monkeyDLink);
  }
</script>
